services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # inside the network the bridge is reached by service name, not 127.0.0.1
      WHATSAPP_BRIDGE_URL: http://whatsapp-bridge:3001
    networks:
      - backend
    stop_grace_period: 30s
    restart: unless-stopped

  whatsapp-bridge:
    build:
      context: ./services/whatsapp-bridge
    env_file: .env
    environment:
      WHATSAPP_BRIDGE_DATA_DIR: /data/whatsapp-bridge
      WHATSAPP_BRIDGE_HOST: 0.0.0.0
      WHATSAPP_BRIDGE_PORT: "3001"
      WHATSAPP_BRIDGE_FASTAPI_URL: http://app:8000
      WHATSAPP_BRIDGE_QR_MODE: docker
    volumes:
      - ./data/whatsapp-bridge:/data/whatsapp-bridge
    networks:
      - backend
    stop_grace_period: 30s
    restart: unless-stopped
    # port 3001 intentionally NOT published (spec: private network only)

networks:
  backend:
    driver: bridge
