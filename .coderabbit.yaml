
language: en-US

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false

  path_filters:
    - "!**/*.lock"
    - "!**/dist/**"
    - "!**/__pycache__/**"
    - "!**/.venv/**"

  auto_review:
    enabled: true
    drafts: false

chat:
  auto_reply: true
